kind: pipeline
type: kubernetes
name: dockerhub

concurrency:
  limit: 1

trigger:
  event:
    - push
  branch:
    - main

steps:
  - name: test-theme
    image: node:22-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
    commands:
      - npm ci --ignore-scripts --no-audit --no-fund
      - npm test

  - name: package-theme
    image: python:3.13-alpine
    commands:
      - python3 scripts/build.py
      - python3 -m zipfile -t dist/goodui-keycloak-theme.jar

  - name: publish-dockerhub
    image: plugins/kaniko:1.13.13@sha256:f497739d4d9c56783dc031beb8a114c25b360e6cbdfec3fc350b97d2455d2b8a
    settings:
      dockerfile: Dockerfile
      context: .
      repo: cloudfrogger/goodui-keycloak-theme
      username: cloudfrogger
      password:
        from_secret: dockerhub_token
      tags:
        - sha-${DRONE_COMMIT_SHA}
        - '26.8.2'
        - latest

---
kind: secret
name: dockerhub_token
data: euk53IYOoQfl/dTCc0ZlGablk8hA0i0qDfwctydwSCoV8nKtLpgWPLBFwhQlh8Db44UZyrqNfUA/o+W6VZ+qpg==

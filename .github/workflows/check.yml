name: Check and package theme
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: python3 scripts/sync-resources.py && git diff --exit-code
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: docker compose up -d
      - name: Wait for Keycloak
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8089/realms/goodui/.well-known/openid-configuration > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: goodui-keycloak-theme
          path: dist/*
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            test-results/
            docs/*.png
      - if: always()
        run: docker compose down
  docker:
    name: Test and publish Docker image
    needs: verify
    runs-on: ubuntu-24.04
    concurrency:
      group: dockerhub-${{ github.ref }}
      cancel-in-progress: false
    env:
      GOODUI_IMAGE: goodui-keycloak-theme:test
      GOODUI_TEST_PORT: '8092'
      KEYCLOAK_BASE_URL: http://localhost:8092
      DOCKERHUB_IMAGE: cloudfrogger/goodui-keycloak-theme
      PUBLISH_IMAGE: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.GOODUI_IMAGE }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start optimized image with PostgreSQL
        run: docker compose -p goodui-image-test -f compose.image-test.yaml up -d
      - name: Wait for production image
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent "$KEYCLOAK_BASE_URL/realms/goodui/.well-known/openid-configuration" > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -p goodui-image-test -f compose.image-test.yaml logs
          exit 1
      - name: Test production image in browser
        run: npm run test:e2e
      - name: Login to Docker Hub
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested image
        if: env.PUBLISH_IMAGE == 'true'
        run: python3 scripts/publish-image.py
      - name: Production image browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-image-browser-evidence
          path: |
            test-results/
            docs/*.png
      - name: Stop production image test stack
        if: always()
        run: docker compose -p goodui-image-test -f compose.image-test.yaml down -v

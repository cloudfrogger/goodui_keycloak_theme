# Isolated test stack: tests the production image, not a mounted theme folder.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: local-image-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 2s
      timeout: 3s
      retries: 30
  keycloak:
    image: ${GOODUI_IMAGE:-goodui-keycloak-theme:test}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GOODUI_TEST_PORT:-8092}:8080"
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: local-image-test-only
      KC_HOSTNAME: http://localhost:${GOODUI_TEST_PORT:-8092}
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-change-me
    command:
      - start
      - --optimized
      - --import-realm
      - --spi-theme--welcome-theme=goodui
    volumes:
      - ./dev/realm.json:/opt/keycloak/data/import/goodui-realm.json:ro
